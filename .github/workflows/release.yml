name: Release PANBOX agent and optional AI worker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build portable agent archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="panbox_${version}_${goos}_${goarch}"
            agent="panbox-agent_${goos}_${goarch}"
            mkdir -p "dist/$name"
            suffix=""
            if [[ "$goos" == windows ]]; then suffix=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.releaseVersion=$GITHUB_REF_NAME" -o "dist/$agent$suffix" ./cmd/panbox
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/panbox-ai-worker_${goos}_${goarch}$suffix" ./cmd/panbox-ai-worker
            cp "dist/$agent$suffix" "dist/$name/panbox$suffix"
            if [[ "$goos" == windows ]]; then
              (cd dist && zip -q -r "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          cp scripts/install-agent.sh scripts/install-agent.ps1 dist/
          (cd dist && sha256sum panbox-agent_* panbox-ai-worker_* *.tar.gz *.zip install-agent.sh install-agent.ps1 > SHA256SUMS)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/panbox-agent_* dist/panbox-ai-worker_* dist/*.tar.gz dist/*.zip dist/install-agent.sh dist/install-agent.ps1 dist/SHA256SUMS --prerelease --title "PANBOX $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
