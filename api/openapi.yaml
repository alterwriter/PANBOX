openapi: 3.1.0
info:
  title: PANBOX API
  version: 0.1.0
  description: Beta self-hosted API. Admin GitLab/GitHub connections can discover and enroll private repositories; uploads require each PANBOX project ID and an API key with scans:write plus project access. Scan uploads never auto-enroll.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /v1/scm-connections:
    get:
      description: Admin browser session only. List connection metadata; secrets are never returned.
      responses: {'200': {description: SCM connections}}
    post:
      description: Admin browser session only. Test a GitLab service account or GitHub App, encrypt its credential, and auto-enroll accessible repositories when enabled. Reads at most 500 repositories per sync.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [provider, label, enabled, auto_enroll], properties: {provider: {type: string, enum: [gitlab, github]}, label: {type: string}, base_url: {type: string}, enabled: {type: boolean}, auto_enroll: {type: boolean}, token: {type: string, description: GitLab service account token with read_api}, app_id: {type: integer}, installation_id: {type: integer}, private_key: {type: string, description: GitHub App PEM key}}}
      responses: {'200': {description: Connection saved with ID and optional import counts}, '422': {description: Provider test failed}}
  /v1/scm-connections/{id}:
    put:
      description: Admin browser session only. Update label, enablement, auto-enrollment, or rotate credential. Provider and host stay fixed; omitted secrets retain the old value.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Connection updated}}
    delete:
      description: Admin browser session only. Delete connection credential; enrolled repositories and scan history remain.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Connection deleted}}
  /v1/scm-connections/{id}/repositories:
    get:
      description: Admin browser session only. Discover up to 500 accessible repository paths and their PANBOX/exclusion state without importing them.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Discovered repositories and truncated flag}}
  /v1/scm-connections/{id}/sync:
    post:
      description: Admin browser session only. Revalidate provider access, import new repositories and refresh auto-detected branch metadata. Requires enabled connection and auto_enroll.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Created, existing, ignored, and truncated counts}}
  /v1/scm-connections/{id}/reinclude:
    post:
      description: Admin browser session only. Remove deliberate deletion exclusion; next Sync may import the repository again.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [path], properties: {path: {type: string}}}
      responses: {'200': {description: Repository eligible for future sync}}
  /healthz:
    get:
      security: []
      responses: {'200': {description: Server process is healthy}}
  /readyz:
    get:
      security: []
      responses: {'200': {description: Database ready}, '503': {description: Database unavailable}}
  /v1/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string}}}
      responses: {'200': {description: HttpOnly session cookie and CSRF token}, '401': {description: Invalid credentials}}
  /v1/me:
    get:
      responses: {'200': {description: Principal and permissions}}
  /v1/roles:
    get:
      responses: {'200': {description: Roles and permissions}}
  /v1/roles/{name}:
    put:
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [permissions], properties: {description: {type: string}, permissions: {type: array, items: {type: string}}}}
      responses: {'200': {description: Role saved}, '403': {description: Admin role immutable}}
  /v1/users:
    get:
      responses: {'200': {description: Users and roles}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email, password, role], properties: {email: {type: string}, password: {type: string}, role: {type: string}}}
      responses: {'201': {description: User created}}
  /v1/users/{id}/roles:
    put:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Non-admin roles assigned}}
  /v1/credentials:
    get:
      responses: {'200': {description: Metadata only, never secrets}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, label, scopes, expires_hours]
              properties:
                kind: {type: string, enum: [api, access, scan]}
                label: {type: string}
                scopes: {type: array, items: {type: string}}
                repository_id: {type: string}
                expires_hours: {type: integer, minimum: 1, maximum: 8760}
      responses: {'201': {description: One-time secret returned}}
  /v1/credentials/{id}:
    delete:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Credential revoked}}
  /v1/credentials/{id}/rotate:
    post:
      description: Key owner or Admin creates a replacement and revokes the prior API or access key. Plaintext is shown once; hashes cannot be copied back.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expires_hours], properties: {expires_hours: {type: integer, minimum: 1, maximum: 8760}}}
      responses: {'201': {description: Replacement key with one-time plaintext}, '409': {description: Legacy scan key must be replaced with API key}}
  /v1/repos:
    get:
      parameters: [{name: include_archived, in: query, schema: {type: boolean}, description: Admin only}]
      responses: {'200': {description: Authorized repository list with SCM origin, default branch source, owner, archived status, SCM check, and nullable last_scan_at from any branch}}
    post:
      description: Manually enroll an SCM project before its first scan. Connected GitLab/GitHub credentials verify private metadata; otherwise private/unreachable auto branch mode remains pending until CI supplies git.default_branch. Owner is display metadata. The response ID is PANBOX's internal project ID for PANBOX_REPOSITORY_ID. Requires repos:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name, provider, provider_project_id], properties: {name: {type: string}, provider: {type: string}, provider_project_id: {type: string}, scm_base_url: {type: string, description: HTTPS origin allowlisted in PANBOX_SCM_ALLOWED_HOSTS}, scm_connection_id: {type: string}, default_branch: {type: string}, branch_mode: {type: string, enum: [auto, manual]}, owner: {type: string}}}
      responses: {'201': {description: Enrolled PANBOX project ID, detected or pending default branch, owner, and SCM check status}}
  /v1/repos/inspect:
    post:
      description: Check SCM metadata from the PANBOX host before enrollment. Connected GitLab/GitHub credentials can verify private repositories. This does not prove runner delivery. Requires repos:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [provider, provider_project_id], properties: {provider: {type: string}, provider_project_id: {type: string}, scm_base_url: {type: string}, scm_connection_id: {type: string}}}
      responses: {'200': {description: 'SCM status: verified, reachable_no_branch, or manual_required; includes detected default_branch and owner when available'}}
  /v1/repos/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Repository detail, scan/finding counts, and nullable last_scan_at from any branch}}
    put:
      description: Requires repos:write. SCM identity is locked after first scan; display name, owner, and default branch remain editable.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name, provider, provider_project_id, branch_mode], properties: {name: {type: string}, provider: {type: string}, provider_project_id: {type: string}, scm_base_url: {type: string}, scm_connection_id: {type: string}, default_branch: {type: string}, branch_mode: {type: string, enum: [auto, manual]}, owner: {type: string}}}
      responses: {'200': {description: Repository updated}, '409': {description: Identity locked or duplicate}}
    delete:
      description: Admin only. Unscanned repositories are deleted; scanned repositories are archived and their keys revoked.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: confirm, in: query, required: true, schema: {type: string}, description: Exact repository name}]
      responses: {'200': {description: Deleted or archived}}
  /v1/repos/{id}/restore:
    post:
      description: Admin only. Existing API keys retain their original scope; rotate or create a new key if access policy changed.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Repository restored}, '409': {description: Active SCM identity collision}}
  /v1/repos/{id}/recheck-scm:
    post:
      description: Recheck enrolled SCM metadata; verified metadata refreshes only an auto-detected default branch. Manual overrides remain unchanged. Requires repos:write and repository access.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Updated SCM status and detected metadata}, '403': {description: Repository denied}, '404': {description: Repository not found}}
  /v1/repos/{id}/scan-tokens:
    post:
      deprecated: true
      description: Legacy alpha endpoint. New CI integrations create a normal API key with scans:write through /v1/credentials and use PANBOX_API_KEY.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Repository-bound one-time scan key}}
  /v1/repos/{id}/scan-config:
    get:
      description: Requires repos:read or a bearer API key with scans:write and project access. The agent reads this before an online scan.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Enabled modules and gate threshold}}
    put:
      description: Requires repos:write and repository access. Applies to future uploads.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [enabled, vaccin, enetron, gate_severity], properties: {enabled: {type: boolean}, vaccin: {type: boolean}, enetron: {type: boolean}, gate_severity: {type: string, enum: [info, low, medium, high, critical]}}}
      responses: {'200': {description: Updated scan policy version}, '400': {description: Invalid module or severity}}
  /v1/repos/{id}/members/{user}:
    put:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: user, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Admin granted repository membership}}
    delete:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: user, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Admin removed repository membership}}
  /v1/scans:
    get:
      responses: {'200': {description: Recent authorized scans}}
    post:
      description: Requires a bearer API key with scans:write and project access. PANBOX_REPOSITORY_ID identifies the enrolled project; it is not a secret. Legacy scan keys continue to work for existing alpha jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScanBundle'}
      responses: {'201': {description: Scan ingested}, '200': {description: Idempotent retry}, '403': {description: Repository scope denied}, '409': {description: Scanning or selected module disabled}}
  /v1/scans/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Scan metadata and current gate revision}}
  /v1/scans/{id}/findings:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Finding detail rows for this scan, including source path and line, commit-pinned source link when available, rule-relevant public reference URL, and remediation guidance}}
  /v1/ai-review/settings:
    get:
      description: Admin browser session only. Returns enabled, provider, model, per-scan finding cap, and provider-key presence flags; never returns secrets.
      responses: {'200': {description: AI review configuration}}
    put:
      description: Admin browser session and CSRF required. Enabling requires a provider API key configured on the PANBOX server. Private source snippets are sent to the chosen provider only when enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [enabled, provider, model, max_findings], properties: {enabled: {type: boolean}, provider: {type: string, enum: [codex, openai, anthropic]}, model: {type: string, description: "Optional for codex; uses the host CLI default when empty."}, max_findings: {type: integer, minimum: 1, maximum: 10}}}
      responses: {'200': {description: Settings saved}, '409': {description: Provider key missing}}
  /v1/ai-review/runs:
    get:
      description: Admin browser session only. Last 50 advisory runs. AI review is asynchronous and never changes the native scan gate.
      responses: {'200': {description: Run metadata}}
  /v1/ai-review/runs/{id}:
    get:
      description: Admin browser session only. Returns sanitized process events and advisory per-finding assessments; no raw source, prompts, credentials, or model reasoning traces.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Run status, events, and assessments}}
  /v1/scans/{id}/ai-review:
    post:
      description: Admin browser session and CSRF required. Queues an AI review for an existing scan when enabled.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: Review queued}, '409': {description: AI review disabled}}
  /v1/findings:
    get:
      parameters:
        - {name: repository_id, in: query, schema: {type: string}}
        - {name: branch, in: query, schema: {type: string}}
        - {name: module, in: query, schema: {type: string}}
        - {name: severity, in: query, schema: {type: string}}
      responses: {'200': {description: Up to 1000 authorized branch finding rows with path and line, public guidance URL, and open, triaged, or resolved lifecycle status}}
  /v1/findings/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: branch, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Finding detail with rule-specific or general remediation guidance, commit-pinned source URL when available, curated OWASP/Django or OSV reference_url, and last 100 eligible complete scans. Guidance is advisory and does not establish exploitability.}}
  /v1/findings/{id}/disposition:
    post:
      description: Requires findings:recast. Sets global triage state, records reason, and revises affected gates.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [status, reason], properties: {status: {type: string, enum: [open, false_positive, accepted_risk, closed]}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses: {'200': {description: Triage saved and gates revised}}
  /v1/findings/{id}/dispositions:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Recent immutable triage events}}
  /v1/findings/{id}/recast:
    post:
      description: Requires findings:recast and repository access. Updates effective severity across occurrences, recalculates affected gates, and records history. Use severity raw to restore scanner severity.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [severity, reason], properties: {severity: {type: string, enum: [raw, info, low, medium, high, critical]}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses: {'200': {description: Recast saved and gates revised}, '403': {description: Permission or repository denied}}
  /v1/findings/{id}/recasts:
    get:
      description: Requires findings:read and repository access.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Recent recast history}}
  /v1/metrics/overview:
    get:
      responses: {'200': {description: Default branch latest-scan posture and coverage}}
  /v1/reports/technical:
    get:
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [csv, json, pdf]}}
        - {name: repository_id, in: query, schema: {type: string}}
        - {name: branch, in: query, schema: {type: string}}
        - {name: module, in: query, schema: {type: string, enum: [vaccin, enetron]}}
        - {name: severity, in: query, schema: {type: string}}
      responses: {'200': {description: Audited technical export}}
  /v1/audit-events:
    get:
      responses: {'200': {description: Recent audit events}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    ScanBundle:
      type: object
      additionalProperties: false
      required: [schema_version, client_scan_id, scope, repository_id, git, modules, findings]
      properties:
        schema_version: {type: string, const: '1.0'}
        client_scan_id: {type: string}
        scope: {type: string, const: repo}
        repository_id: {type: string}
        git: {type: object, required: [branch, commit_sha], properties: {branch: {type: string}, default_branch: {type: string, description: Trusted CI metadata used only when enrolled branch source is ci_pending}, commit_sha: {type: string}, base_sha: {type: string}}}
        modules: {type: array, items: {type: object, required: [name, status], properties: {name: {type: string, enum: [vaccin, enetron]}, engine: {type: string, description: Native scanner engine identifier}, version: {type: string, description: Scanner engine version reported by the agent, not the GitHub release tag}, status: {type: string, enum: [complete, error]}}}}
        findings: {type: array, items: {type: object, required: [module, rule_id, raw_severity], properties: {module: {type: string}, rule_id: {type: string}, raw_severity: {type: string, enum: [critical, high, medium, low, info]}, fingerprint: {type: string}, location: {type: object, properties: {path: {type: string}, line: {type: integer}}}, message: {type: string}}}}
