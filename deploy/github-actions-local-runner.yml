# Copy into .github/workflows/panbox.yml in a repository being scanned.
# Uses a hosted Linux runner. PANBOX_SERVER must be reachable over HTTPS.
# Repository variables: PANBOX_REPOSITORY_ID, PANBOX_SERVER. Secret: PANBOX_API_KEY.
name: PANBOX scan
on:
  push:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check runner checkout and PANBOX route
        run: |
          git rev-parse --is-inside-work-tree
          curl -fsS "$PANBOX_SERVER/readyz"
        env:
          PANBOX_SERVER: ${{ vars.PANBOX_SERVER }}
      - name: Install agent only from pinned PANBOX release
        env:
          PANBOX_VERSION: v0.1.0-alpha.6
        run: |
          curl -fsSL "https://github.com/alterwriter/PANBOX/releases/download/${PANBOX_VERSION}/install-agent.sh" -o "$RUNNER_TEMP/install-panbox-agent.sh"
          sh "$RUNNER_TEMP/install-panbox-agent.sh" "$PANBOX_VERSION" "$RUNNER_TEMP/panbox-bin"
      - name: Run PANBOX
        env:
          PANBOX_API_KEY: ${{ secrets.PANBOX_API_KEY }}
          PANBOX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PANBOX_REPOSITORY_ID: ${{ vars.PANBOX_REPOSITORY_ID }}
          PANBOX_SERVER: ${{ vars.PANBOX_SERVER }}
        run: |
          "$RUNNER_TEMP/panbox-bin/panbox" go --server "$PANBOX_SERVER" --repo "$PANBOX_REPOSITORY_ID" --path . --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
