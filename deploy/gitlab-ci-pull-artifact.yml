# The shared runner produces an artifact. A tiny local PANBOX timer imports it.
# This path is asynchronous: it does not block the GitLab pipeline on PANBOX gate.
panbox_bundle:
  stage: test
  image: alpine:3.22
  variables:
    PANBOX_VERSION: v0.1.0-alpha.5
  before_script:
    - apk add --no-cache curl
    - curl -fsSL "https://github.com/alterwriter/PANBOX/releases/download/${PANBOX_VERSION}/install-agent.sh" -o install-panbox-agent.sh
    - sh install-panbox-agent.sh "$PANBOX_VERSION" "$CI_PROJECT_DIR/.panbox/bin"
  script:
    - '"$CI_PROJECT_DIR/.panbox/bin/panbox" go --offline --repo "$PANBOX_REPOSITORY_ID" --path . --branch "$CI_COMMIT_REF_NAME" --commit "$CI_COMMIT_SHA" --base-sha "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" --output panbox-results.json || test "$?" -eq 2'
  artifacts:
    when: always
    paths: [panbox-results.json]
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
